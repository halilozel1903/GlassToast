<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="GlassToast: Liquid Glass toasts for SwiftUI" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="blob1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="shadow" x="-20%" y="-50%" width="140%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="560" fill="url(#bg)"/>
  <circle cx="930" cy="170" r="220" fill="url(#blob1)" filter="url(#blur)"/>
  <circle cx="1120" cy="430" r="200" fill="url(#blob2)" filter="url(#blur)"/>

  <g font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="235" fill="#ffffff" font-size="76" font-weight="800" letter-spacing="-2">GlassToast</text>
    <text x="82" y="290" fill="#cbd5e1" font-size="28" font-weight="500">Liquid Glass toasts &amp; banners for SwiftUI</text>
    <g font-size="20" font-weight="600">
      <rect x="82" y="330" width="106" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="135" y="357" fill="#e2e8f0" text-anchor="middle">iOS 26</text>
      <rect x="200" y="330" width="120" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="260" y="357" fill="#e2e8f0" text-anchor="middle">Swift 6</text>
      <rect x="332" y="330" width="96" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="380" y="357" fill="#e2e8f0" text-anchor="middle">SPM</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="720" y="90" width="460" height="84" rx="30" fill="url(#glass)" stroke="url(#rim)" stroke-width="1.5"/>
      <circle cx="768" cy="132" r="16" fill="#22c55e"/>
      <path d="M760 132 l6 6 l11 -12" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="800" y="126" fill="#ffffff" font-size="22" font-weight="700">Photo saved</text>
      <text x="800" y="154" fill="#e2e8f0" font-size="18">Added to your library.</text>
    </g>
    <g filter="url(#shadow)" opacity="0.95">
      <rect x="740" y="194" width="420" height="76" rx="28" fill="url(#glass)" stroke="url(#rim)" stroke-width="1.5"/>
      <circle cx="786" cy="232" r="15" fill="#3b82f6"/>
      <rect x="784" y="229" width="4" height="12" rx="2" fill="#fff"/>
      <circle cx="786" cy="223" r="2.5" fill="#fff"/>
      <text x="816" y="240" fill="#ffffff" font-size="21" font-weight="700">Message archived</text>
      <text x="1110" y="240" fill="#93c5fd" font-size="20" font-weight="700" text-anchor="end">Undo</text>
    </g>
    <g filter="url(#shadow)" opacity="0.85">
      <rect x="760" y="290" width="380" height="70" rx="26" fill="url(#glass)" stroke="url(#rim)" stroke-width="1.5"/>
      <path d="M800 309 l14 26 h-28 z" fill="#f97316"/>
      <text x="830" y="333" fill="#ffffff" font-size="20" font-weight="700">Low storage</text>
    </g>
  </g>
</svg>
