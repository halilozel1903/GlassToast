name: GlassToastDemo
options:
  bundleIdPrefix: io.github.halilozel1903
  deploymentTarget:
    iOS: "17.0"
packages:
  GlassToast:
    path: ..
targets:
  GlassToastDemo:
    type: application
    platform: iOS
    sources:
      - GlassToastDemo
    dependencies:
      - package: GlassToast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.halilozel1903.GlassToastDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  GlassToastDemo:
    build:
      targets:
        GlassToastDemo: all
    run:
      config: Debug
